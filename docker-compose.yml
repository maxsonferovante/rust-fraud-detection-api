services:
  lb:
    build:
      context: .
      args:
        RESOURCES_IMAGE: maxsonferovante/fraud-detection-resources:local
    platform: linux/amd64
    command: ["./lb"]
    cpuset: "2,3"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - FD_UPSTREAMS=/tmp/sock/api1.sock,/tmp/sock/api2.sock
      - LB_BACKLOG=65535
      - LB_ACCEPT_BATCH=128
    volumes:
      - sock-volume:/tmp/sock
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "20MB"

  api1:
    build:
      context: .
      args:
        RESOURCES_IMAGE: maxsonferovante/fraud-detection-resources:local
    platform: linux/amd64
    command: ["./fraud-detection-api"]
    cpuset: "0"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - RUST_LOG=off
      - N_PROBES=8
      - RINHA_INDEX_PATH=resources/specialist.bin
      - RINHA_SOCK_PATH=/tmp/sock/api1.sock
    volumes:
      - sock-volume:/tmp/sock
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "165MB"

  api2:
    build:
      context: .
      args:
        RESOURCES_IMAGE: maxsonferovante/fraud-detection-resources:local
    platform: linux/amd64
    command: ["./fraud-detection-api"]
    cpuset: "1"
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - RUST_LOG=off
      - N_PROBES=8
      - RINHA_INDEX_PATH=resources/specialist.bin
      - RINHA_SOCK_PATH=/tmp/sock/api2.sock
    volumes:
      - sock-volume:/tmp/sock
    network_mode: none
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "165MB"

volumes:
  sock-volume:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  default:
    driver: bridge
