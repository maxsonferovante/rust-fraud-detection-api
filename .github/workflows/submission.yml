name: CI/CD Submission

on:
  pull_request:
    branches:
      - submission
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'submission' && github.event.pull_request.head.ref == 'master'
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Timestamp Tag
        id: vars
        run: echo "tag=$(date +'%d-%m-%Y-%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # O runtime eh amd64-only (binario x86_64 + flags AVX2/Haswell).
          platforms: linux/amd64
          tags: maxsonferovante/fraud-detection-api:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Submission Branch
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and switch to submission branch
          git fetch origin submission
          git checkout -f submission

          # Clean submission branch (remove everything)
          git rm -rf .

          # Checkout necessary files from master
          git checkout master -- info.json docker-compose.yml README.md LICENSE

          # Replace each service build block with the published image tag
          python3 -c 'import pathlib,re,sys; path=pathlib.Path(sys.argv[1]); image=sys.argv[2]; text=path.read_text(); text,count=re.subn(r"(?m)^ {4}build:\n {6}context: \.\n", f"    image: {image}\n", text); assert count == 3, f"expected 3 build blocks, replaced {count}"; assert "image:" in text, "submission compose has no image entries"; path.write_text(text)' "$PWD/docker-compose.yml" "maxsonferovante/fraud-detection-api:${{ steps.vars.outputs.tag }}"

          # Commit and push back to submission branch
          git add info.json docker-compose.yml README.md LICENSE
          git commit -m "chore: automatic submission update - tag ${{ steps.vars.outputs.tag }}"

          # Push using the GITHUB_TOKEN for authentication
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git submission

      - name: Comment and Close PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh pr comment $PR_NUMBER --body "🚀 **Submissão para a Rinha de Backend 2026 atualizada!**

          A branch \`submission\` foi sincronizada com sucesso e a nova imagem multi-plataforma (amd64/arm64) foi publicada.

          **Imagem:** \`maxsonferovante/fraud-detection-api:$TAG\`
          **Link:** [Docker Hub](https://hub.docker.com/r/maxsonferovante/fraud-detection-api/tags?name=$TAG)

          Este Pull Request está sendo fechado automaticamente pois o processo de submissão foi concluído."

          gh pr close $PR_NUMBER
